[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quantresearch-manager-gui"
version = "0.1.0"
description = "Read-only Manager GUI owner package and ManagerReadModel v0"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

[project.scripts]
manager-gui = "manager_gui.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/manager_gui"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
